<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-box {
            width: 380px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;
        }

       
        select {
            width: 90%;
            padding: 6px;
        }

        button {
            padding: 8px 20px;
            background-color: #008b35;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6a0000;
            transition: 1s;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Student Registration</h2>

        <form name="studentForm" onsubmit="return checkData()">
            <table>
                <tr>
                    <td>Name:</td>
                    <td><input type="text" id="name"></td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td><input type="email" id="email"></td>
                </tr>

                <tr>
                    <td>Roll No:</td>
                    <td><input type="text" id="rollno"></td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="Male"> Male
                        <input type="radio" name="gender" value="Female"> Female
                    </td>
                </tr>

                <tr>
                    <td>Course:</td>
                    <td>
                        <select id="course">
                            <option value="">Select Course</option>
                            <option value="MCA">MCA</option>
                            <option value="BCA">BCA</option>
                            <option value="BBA">BBA</option>
                            <option value="B.Tech">B.Tech</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Contact No:</td>
                    <td><input type="text" id="contact"></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <br>
                        <button type="submit">Register</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <script>
        function checkData() {
            // DOM selection using getElementById
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let roll = document.getElementById("rollno").value;
            let course = document.getElementById("course").value;
            let contact = document.getElementById("contact").value;

            // Radio button validation
            let gender = document.querySelector('input[name="gender"]:checked');

            // All fields validation
            if (name == "" || email == "" || roll == "" || course == "" || contact == "" || gender == null) {
                alert("Please fill all fields.");
                return false;
            }

            // Contact number validation
            if (contact.length != 10 || isNaN(contact)) {
                alert("Please enter a valid 10-digit contact number.");
                return false;
            }

            alert("Form submitted successfully!");
            return true;    
        }
    </script>

</body>
</html>
